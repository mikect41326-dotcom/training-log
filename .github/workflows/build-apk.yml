name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html catalog.json manifest.webmanifest icon-192.png icon-512.png www/

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#141414" --iconBackgroundColorDark "#141414" --splashBackgroundColor "#141414" --splashBackgroundColorDark "#141414"

      - name: Version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Sign with your key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          EXPECTED: ef345f1d8698d6c2d641b05a30c805aa1a4005fab818b3ed6dfecaa0c40b81f1
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The DEBUG_KEYSTORE_B64 secret is missing. Add it in Settings, Secrets and variables, Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/app.keystore"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          SIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          "$SIGNER" sign --ks "$RUNNER_TEMP/app.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out training-log.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$SIGNER" verify --print-certs training-log.apk | tee certs.txt
          if grep -qi "SHA-256 digest: $EXPECTED" certs.txt; then
            echo "Signed with your saved key, so updates install over the top."
          else
            echo "::error::The APK was not signed with your saved key. Check the DEBUG_KEYSTORE_B64 secret."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/app.keystore"

      - uses: actions/upload-artifact@v5
        with:
          name: training-log-apk
          path: training-log.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Training Log 1.0.${{ github.run_number }}
          body: Install training-log.apk on your phone. Signed with your saved key, so it installs over earlier signed versions.
          files: training-log.apk
          make_latest: true
