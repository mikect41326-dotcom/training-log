<html lang="en-GB">
<head>

<style>
:root{
  color-scheme:dark;
  --bg:#141414; --surface-1:#1e1e1e; --surface-2:#262626; --line:#333;
  --text-primary:#efefef; --text-secondary:#9c9c9c;
  --series-1:#338ced; --series-2:#e76624; --series-3:#00a888;
  --good:#0aac23; --warn:#d28e05; --bad:#e5484d;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px, env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)) 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
main{padding:12px;max-width:720px;margin:0 auto}
h2{font-size:20px;margin:4px 0 8px}
h3{font-size:16px;margin:0 0 8px}
a{color:var(--series-1)}
.card{background:var(--surface-1);border-radius:var(--r);padding:14px;margin:0 0 12px;border:1px solid var(--line)}
.muted{color:var(--text-secondary)} .small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--surface-2);border-radius:99px;padding:3px 10px;font-size:13px}
button.chip.on{background:var(--series-1);border-color:var(--series-1)!important;color:#fff}
.chip.warn{background:#4a3500;color:#ffd27a}
.chip.good{background:#0d3b15;color:#8ef09c}
.chip.bad{background:#4a1416;color:#ffb3b5}
.note{background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:8px 0 0;font-size:14px}
.btn,button{font:inherit;color:var(--text-primary);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary,button.primary{background:var(--series-1);border-color:var(--series-1);color:#fff}
button.danger{color:#ffb3b5;border-color:#5a2427}
button:active{transform:scale(.97)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,textarea,select{font:inherit;color:var(--text-primary);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:0 0 10px} label.f span{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datenav .d{flex:1;text-align:center;font-weight:600}
.datenav button{padding:8px 14px}
/* exercise cards */
.ex .top{display:flex;gap:10px;align-items:flex-start}
.badge{min-width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.ex .name{font-weight:600;font-size:16px}
.ex .presc{font-size:13px;color:var(--text-secondary)}
.prog{font-size:13px;margin:8px 0 4px;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.prog.add{background:#0d3b15;color:#8ef09c}
.prog.low{background:#4a1416;color:#ffb3b5}
.prog.deload{background:#4a3500;color:#ffd27a}
.rows{margin-top:8px}
.row,.rowh{display:grid;grid-template-columns:44px 1fr 1fr 1fr 44px;gap:6px;align-items:center;margin-bottom:6px}
.rowh{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.row .lbl{font-size:13px;color:var(--text-secondary);text-align:center}
.row input{text-align:center;padding:10px 4px;font-size:16px}
.row .tick{padding:9px 0;width:44px;color:var(--text-secondary)}
.row.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.row.done input{border-color:#2a5a32}
.row.warm .lbl{font-style:italic}
.exfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.exfoot button{padding:6px 10px;font-size:13px}
.groupgap{height:4px}
/* ticks */
.ticks{display:flex;flex-direction:column;gap:6px}
.tickitem{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.tickitem .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--text-secondary);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.tickitem.on{border-color:#2a5a32}
.tickitem.on .box{background:var(--good);border-color:var(--good);color:#fff}
.tickitem .t{flex:1}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile .v{font-size:20px;font-weight:700}
.tile .k{font-size:12px;color:var(--text-secondary)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--text-secondary);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
/* week grid in plan */
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wd{background:var(--surface-2);border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;text-decoration:none;color:var(--text-primary);border:1px solid transparent;min-height:58px}
.wd b{display:block;font-size:12px}
.wd .s{font-size:16px;display:block;margin-top:2px}
.wd.today{border-color:var(--series-1)}
.wd.rest{opacity:.55}
.wd.done{background:#0d3b15}
.wd.part{background:#3a3000}
/* bars */
.bar{display:grid;grid-template-columns:92px 1fr 52px;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.bar .track{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0}
.bar .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-primary)}
/* charts */
.chartwrap{position:relative}
.chartwrap svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chartwrap .tip{position:absolute;pointer-events:none;background:#000c;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;white-space:nowrap;display:none;z-index:2}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.dot{width:8px;height:8px;border-radius:50%}
/* rating */
.rate{display:flex;gap:6px;margin:4px 0 10px}
.rate button{flex:1;padding:8px 0}
.rate button.on{background:var(--series-1);border-color:var(--series-1);color:#fff}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#101010;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px))}
nav a{color:var(--text-secondary);text-decoration:none;text-align:center;padding:9px 0 10px;font-size:12px}
nav a .i{display:block;font-size:20px;line-height:1.1}
nav a.on{color:var(--series-1)}
/* rest timer */
#timer{position:fixed;left:10px;right:10px;bottom:calc(66px + max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)));z-index:7;background:var(--series-1);color:#fff;border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 6px 20px #0008}
#timer .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
#timer .l{flex:1;font-size:13px}
#timer button{background:#ffffff26;border-color:#ffffff40;color:#fff;padding:6px 10px}
#timer.over{background:var(--good)}
/* modal */
#modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--surface-1);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
details>summary{cursor:pointer;font-weight:600}
ul.plain{margin:6px 0 0;padding-left:18px}
.mrow{display:grid;grid-template-columns:1fr 84px 74px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow input{text-align:center;font-size:16px;padding:10px 4px}
.mchg{text-align:right;line-height:1.3}
.edit-ex{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--bg)}
.edit-ex .grid4 label.f,.edit-ex .grid3 label.f{margin-bottom:6px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
.chk input{width:auto}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:8px 14px;border-radius:10px;z-index:30;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

    <div class="rows"><div class="rowh"><span></span><span>kg</span><span>reps</span><span>RIR</span><span></span></div>${rows}</div>

}

/* ---------- charts ---------- */
const charts = new Map(); let chartSeq = 0;
function lineChart(series, opts = {}) {
  const pts = series.flatMap(s => s.pts);
  if (pts.length < 2) return `<p class="muted small">Not enough data yet. Log a couple more ${opts.what || "entries"} to see a trend.</p>`;
  const W = 340, H = opts.h || 170, L = 38, R = 10, T = 10, B = 22;
  const dates = [...new Set(pts.map(p => p.x))].sort(), d0 = dates[0], span = Math.max(1, diffDays(dates[dates.length - 1], d0));
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
  if (opts.yMin != null) { lo = opts.yMin; hi = opts.yMax; }
  else { const padY = (hi - lo) * 0.1 || 1; lo -= padY; hi += padY; }
  const X = d => L + diffDays(d, d0) / span * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const dec = opts.dec ?? 1;
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#2c2c2c"/><text x="${L - 4}" y="${y + 4}" text-anchor="end" font-size="10" fill="#9c9c9c">${fmtN(v, dec)}</text>`; }
  const xl = [dates[0], dates[Math.floor(dates.length / 2)], dates[dates.length - 1]].filter((v, i, a) => a.indexOf(v) === i);
  xl.forEach((d, i) => g += `<text x="${X(d)}" y="${H - 6}" font-size="10" fill="#9c9c9c" text-anchor="${i === 0 ? "start" : i === xl.length - 1 ? "end" : "middle"}">${fmtShort(d)}</text>`);
  let m = "";
  series.forEach(s => {
    const sp = [...s.pts].sort((a, b) => a.x.localeCompare(b.x));
    if (s.line !== false && sp.length > 1) m += `<path d="${sp.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ")}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots) sp.forEach(p => m += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${s.line === false ? 4 : 3}" style="fill:${s.color}" stroke="#1e1e1e" stroke-width="2"/>`);
  });
  const id = "c" + (++chartSeq);
  charts.set(id, { series, dates, X, W, unit: opts.unit || "", dec });
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="${s.line === false ? "dot" : ""}" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `${legend}<div class="chartwrap" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "chart")}">${g}${m}<line class="xh" x1="-10" x2="-10" y1="${T}" y2="${H - B}" stroke="#efefef" stroke-width="1" opacity=".5"/></svg><div class="tip"></div></div>`;
}
function chartHover(e) {
  const w = e.target.closest(".chartwrap"); if (!w) return;
  const c = charts.get(w.dataset.chart); if (!c) return;
  const svg = w.querySelector("svg"), r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * c.W;
  let best = c.dates[0], bd = 1e9; for (const d of c.dates) { const dd = Math.abs(c.X(d) - vx); if (dd < bd) { bd = dd; best = d; } }
  const line = svg.querySelector(".xh"), x = c.X(best); line.setAttribute("x1", x); line.setAttribute("x2", x);
  const rows = c.series.map(s => { const p = s.pts.find(p => p.x === best); return p ? `<div>${esc(s.name)}: <b>${fmtN(p.y, c.dec)}${c.unit}</b>${p.note ? ` <span class="muted">${esc(p.note)}</span>` : ""}</div>` : ""; }).join("");
  const tip = w.querySelector(".tip"); tip.innerHTML = `<div class="muted">${fmtDate(best)}</div>${rows}`; tip.style.display = "block";
  const px = x / c.W * r.width; tip.style.left = Math.min(Math.max(0, px - tip.offsetWidth / 2), r.width - tip.offsetWidth) + "px"; tip.style.top = "-8px"; tip.style.transform = "translateY(-100%)";
}
function chartLeave(e) { const w = e.target.closest && e.target.closest(".chartwrap"); if (!w) return; w.querySelector(".tip").style.display = "none"; w.querySelector(".xh").setAttribute("x1", -10); w.querySelector(".xh").setAttribute("x2", -10); }

/* ---------- views: insights ---------- */
function viewInsights() {
  const b = viewBlock(); if (!b) return noBlocks();
  charts.clear();
  const today = todayIso(), c = ctxFor(today);
  const curWi = c && c.block.id === b.id ? c.wi : (today < b.startDate ? 0 : b.weeks.length - 1);
  const wi = cur.insWeek != null && cur.insWeek < b.weeks.length ? cur.insWeek : curWi;
  let h = blockPicker(b);
  // headline tiles

  for (const d of weekDates(b, wi)) for (const s of S.sets.values()) if (s.date === d && s.kind !== "w" && s.kg > 0 && s.reps > 0) tonnage += s.kg * s.reps;
  const ws = weekStats(b, wi, ckDates(b, wi)), prevAvg = avgWeight(ckDates(b, wi - 1));
  h += `<div class="tiles">${tileS(`${done}/${due}`, "sessions done so far")}${tileS(ws.avg ? fmtN(ws.avg, 1) : "n/a", `avg kg, 7 days to ${fmtShort(ckDate(b, wi))}`)}${tileS(ws.avg && prevAvg ? signed(ws.avg - prevAvg, 2) : "n/a", "kg vs last check-in")}${tileS(tonnage ? fmtN(tonnage / 1000, 1) + " t" : "n/a", `volume load, week ${wi + 1}`)}</div>`;
  h += `<div class="card"><label class="f" style="margin:0"><span>Week shown</span><select data-act="ins-week">${b.weeks.map((w, i) => `<option value="${i}" ${i === wi ? "selected" : ""}>Week ${i + 1}, w/c ${fmtShort(weekDates(b, i)[0])}${w.deload ? " (deload)" : ""}</option>`).join("")}</select></label></div>`;
  // decision

async function download(name, text, type = "application/json") {

    if (DL) { try { await DL.save({ filename: name, data: text }); toast("Saved"); return true; } catch (e) { if (e && e.code === "declined") { toast("Save cancelled"); return false; } } }

  }

    const fs = plugin("Filesystem"), sh = plugin("Share");

        const w = await fs.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" });
        await sh.share({ title: name, dialogTitle: "Save or send " + name, files: [w.uri] });
        return true;
      } catch (e) { if (/cancel/i.test(String(e && (e.message || e)))) return false; toast("Couldn't share the file"); return copyFallback(name, text); }
    }
    return copyFallback(name, text);
  }
  const blob = new Blob([text], { type }), file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone/i.test(navigator.userAgent)) { try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e && e.name === "AbortError") return false; } }
  dl(blob, name); return true;
}
function copyFallback(name, text) {

    sh.innerHTML = `<h3>${esc(name)}</h3><p class="small muted">Saving files isn't available here. Copy this and paste it into a file instead.</p><textarea readonly style="min-height:200px;font-size:12px">${esc(text)}</textarea><div class="btnrow"><button class="primary" id="m-copy">Copy</button><button id="m-cancel">Close</button></div>`;
    m.style.display = "flex";

    $("#m-cancel").onclick = () => { m.style.display = "none"; res(false); };

}
function dl(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

/* ---------- rest timer ---------- */
let timer = null, ac = null;
function startRest(sec, label) { timer = { end: Date.now() + sec * 1000, label, fired: false }; $("#timer").style.display = "flex"; $("#timer").classList.remove("over"); tickTimer(); }
function tickTimer() {
  if (!timer) return;
  const left = Math.round((timer.end - Date.now()) / 1000), a = Math.abs(left);
  $("#timer-t").textContent = (left < 0 ? "+" : "") + Math.floor(a / 60) + ":" + pad(a % 60);
  $("#timer-l").textContent = left > 0 ? "Rest · next: " + timer.label : "Go: " + timer.label;
  if (left <= 0 && !timer.fired) {
    timer.fired = true; $("#timer").classList.add("over");
    if (meta("vibrate", true)) { const hp = plugin("Haptics"); if (hp) { hp.vibrate({ duration: 300 }).catch(() => { }); setTimeout(() => hp.vibrate({ duration: 300 }).catch(() => { }), 450); } else if (navigator.vibrate) navigator.vibrate([250, 120, 250]); }
    if (meta("beep", true)) beep();

}

setInterval(tickTimer, 250);

    }
    case "csv-daily": {

      for (const d of [...S.daily.values()].sort((a, z) => a.date.localeCompare(z.date))) rows.push([d.date, d.weight ?? "", d.steps ?? "", d.sleep ?? "", d.bb ?? "", d.sleepScore ?? "", d.readiness ?? "", (d.meals || []).filter(Boolean).length, d.protein ? "yes" : "", d.amDone ? "yes" : "", d.notes || ""]);

    }

      const hdr = ["date", "block", "week", "avg_weight_kg", "intensity_minutes", "avg_body_battery", "avg_sleep_score", "avg_readiness", ...MEAS.map(m => m[0]), "photos", ...RATINGS, "notes"], rows = [hdr];
      for (const c of [...S.checkins.values()].sort((a, z) => String(ckDateOf(a)).localeCompare(String(ckDateOf(z))))) {
        const [bid, wi] = String(c.id).split("|"), b = S.blocks.get(bid), d = ckDateOf(c);
        rows.push([d || "", b ? b.name : "", Number(wi) + 1, b ? (avgWeight(ckDates(b, Number(wi))) ?? "") && r1(avgWeight(ckDates(b, Number(wi)))) : "", c.im ?? "", ...SCORES.map(k => { const a = b ? avgField(ckDates(b, Number(wi)), k) : null; return a == null ? "" : Math.round(a); }), ...MEAS.map(([k]) => mVal(c, k) ?? ""), c.photos == null ? "" : c.photos ? "yes" : "no", ...RATINGS.map(r => c.ratings && c.ratings[r] || ""), c.notes || ""]);
      }
      download(`training-checkins-${todayIso()}.csv`, rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(",")).join("\n"), "text/csv"); break;
    }
    case "demo": {
      if (!(await confirmAsk("Fill the current block up to today with made-up logs, weigh-ins and check-ins? Existing entries for those days are overwritten."))) return;
      await loadDemo(); toast("Demo data loaded"); go("#/insights"); break;
    }
    case "wipe": if (await confirmAsk("Delete every block, log and setting on this phone? Back up first if in doubt.")) { await clearAll(); await setMeta("seeded", true); toast("All data deleted"); go("#/more"); render(); } break;
    case "del-day": { const d = el.dataset.d; if (!(await confirmAsk(`Delete everything logged for ${fmtDate(d)}? The daily log and meals are kept.`))) return; for (const s of [...S.sets.values()]) if (s.date === d) await remove("sets", s.id); if (S.sessions.has(d)) await remove("sessions", d); render(true); break; }
    case "blk-seed": await save("blocks", normaliseBlock(clone(SEED))); render(); break;
    case "blk-new": {
      const r = await ask("New block", [{ label: "Name", value: "" }, { label: "Start date (Monday)", type: "date", value: mondayOf(addDays(todayIso(), 7)) }, { label: "Weeks", type: "number", value: 6 }], "Create");
      if (!r) return; const w = Math.max(1, Number(r[2]) || 6);
      const b = normaliseBlock({ id: uid("blk"), name: r[0] || "New block", startDate: r[1], weeks: [...Array(w)].map(() => ({ rir: "2" })), days: [] });
      b.nutrition = clone(viewBlock()?.nutrition || { meals: [], notes: [] });
      await save("blocks", b); go("#/edit/" + b.id); break;
    }
    case "blk-clone": {
      const src = S.blocks.get(el.dataset.id); let start = mondayOf(addDays(blockEnd(src), 1)); if (start <= blockEnd(src)) start = addDays(start, 7);
      const r = await ask("Clone block forward", [{ type: "info", text: "Copies the exercises, weeks, rules and meal plan. Logged data is not copied, but progression picks up from your history." }, { label: "Name", value: src.name.replace(/\s*\(copy\)$/, "") + " (copy)" }, { label: "Start date (Monday)", type: "date", value: start }], "Clone");
      if (!r) return; const b = clone(src); b.id = uid("blk"); b.name = r[1]; b.startDate = r[2]; delete b.swaps;
      if (!isValidDate(b.startDate)) return toast("Start date isn't valid");
      await save("blocks", b); toast("Block cloned"); go("#/edit/" + b.id); break;
    }
    case "blk-export": { const b = S.blocks.get(el.dataset.id); download(`block-${b.startDate}.json`, JSON.stringify(b, null, 2)); break; }
    case "blk-import": {
      const txt = await pickFile(); if (!txt) return; let b; try { b = JSON.parse(txt); } catch { return toast("That file isn't valid JSON"); }

    case "ed-addweek": cur.draft.weeks.push({ n: cur.draft.weeks.length + 1, rir: cur.draft.weeks[cur.draft.weeks.length - 1]?.rir || "2", dropSets: false, deload: false, note: "" }); render(true); break;
    case "ed-delweek": if (cur.draft.weeks.length > 1) { cur.draft.weeks.splice(Number(el.dataset.i), 1); render(true); } break;
    case "ed-addex": { const d = cur.draft.days[Number(el.dataset.d)]; d.exercises.push({ group: "", name: "", sets: 3, repMin: 8, repMax: 12, cue: "", muscle: "", drop: false, rest: 60 }); if (d.type !== "weights") d.type = "weights"; render(true); openDetails(Number(el.dataset.d)); break; }
    case "ed-delex": { const d = Number(el.dataset.d); cur.draft.days[d].exercises.splice(Number(el.dataset.i), 1); render(true); openDetails(d); break; }
    case "ed-mv": { const d = Number(el.dataset.d), i = Number(el.dataset.i), j = i + Number(el.dataset.dir), a = cur.draft.days[d].exercises; if (j >= 0 && j < a.length) { [a[i], a[j]] = [a[j], a[i]]; render(true); openDetails(d); } break; }
    case "ed-addmeal": cur.draft.nutrition.meals.push({ time: "", name: "New meal", note: "", items: [], kcal: 0, p: 0, c: 0, f: 0 }); render(true); openDetails("meal"); break;

});
function openDetails(which) { const ds = $$("#view details"); const idx = which === "meal" ? ds.length - 2 : which; if (ds[idx]) ds[idx].open = true; }
document.addEventListener("input", e => { if (e.target.id === "cat-q") { CATS.q = e.target.value; CATS.n = 60; $("#cat-list").innerHTML = catListHtml(); } });
document.addEventListener("pointermove", chartHover);
document.addEventListener("pointerdown", chartHover);
document.addEventListener("pointerleave", chartLeave, true);

/* ---------- demo data (preview only) ---------- */
async function loadDemo() {
  const b = viewBlock(); if (!b) return;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const end = todayIso() < blockEnd(b) ? addDays(todayIso(), -1) : blockEnd(b), start = addDays(b.startDate, -7);
  const base = {};
  for (let d = start, i = 0; d <= end; d = addDays(d, 1), i++) {
    const c = ctxFor(d);
    await save("daily", { date: d, weight: r1(92.8 - i * 0.055 + (rnd() - 0.5) * 0.6), steps: Math.round(8500 + rnd() * 4000), sleep: r1(6.5 + rnd() * 1.5), bb: Math.round(45 + rnd() * 45), sleepScore: Math.round(55 + rnd() * 35), readiness: Math.round(35 + rnd() * 55), meals: [1, 2, 3, 4, 5].map(() => rnd() > 0.1), protein: rnd() > 0.2, amDone: !!(c && c.day.amCardio && rnd() > 0.15) });
    if (!c || c.block.id !== b.id || c.day.type !== "weights") continue;
    const deload = c.week.deload, tgt = rirNum(c.week.rir) ?? 2;
    for (const ex of c.day.exercises) {
      if (base[ex.name] == null) base[ex.name] = { kg: Math.round((10 + rnd() * 50) / 2.5) * 2.5, reps: ex.repMin };
      const bs = base[ex.name], kg = deload ? roundTo(bs.kg * 0.65, 0.5) : bs.kg;
      let all = true;
      for (let n = 1; n <= ex.sets; n++) {
        const reps = Math.max(ex.repMin, Math.min(ex.repMax, bs.reps + (n === 1 ? 1 : 0) - (n > 2 ? 1 : 0) + (rnd() > 0.7 ? 1 : 0)));
        if (reps < ex.repMax) all = false;
        await save("sets", { id: setId(d, ex.name, "s", n), date: d, blockId: b.id, ex: ex.name, kind: "s", n, kg, reps, rir: deload ? 4 : tgt, ts: Date.now() });
      }
      if (!deload) { if (all) { bs.kg += bs.kg >= 40 ? 2.5 : 2; bs.reps = ex.repMin; } else bs.reps = Math.min(ex.repMax, bs.reps + 1); }
    }
    await save("sessions", { date: d, blockId: b.id, done: true, mins: Math.round(55 + rnd() * 25) });
  }
  const m0 = { neck: 41, shoulders: 124, chest: 108, waist: 95, hips: 101, armL: 39.5, armR: 40, forearmL: 31, forearmR: 31.5, thighL: 60, thighR: 60.5, calfL: 39, calfR: 39 };
  for (let wi = 0; wi < b.weeks.length; wi++) {
    const d = ckDate(b, wi); if (d > todayIso()) break;
    const m = {}; for (const k in m0) m[k] = r1(m0[k] + (k === "waist" ? -0.4 * wi : k.startsWith("arm") ? 0.1 * wi : 0) + (rnd() - 0.5) * 0.4);
    const ratings = {}; for (const r of RATINGS) ratings[r] = 2 + Math.floor(rnd() * 3);
    await save("checkins", { id: `${b.id}|${wi}`, date: d, m, im: Math.round(120 + rnd() * 140), photos: true, ratings, notes: "" });
  }
}

/* ---------- router ---------- */
function render(keepScroll) {
  const y = window.scrollY, h = curHash(), [r, a, b] = h.split("/");
  const openD = keepScroll ? $$("#view details").map(d => d.open) : null;
  if (r !== "ex" && h !== currentRoute) cur.backTo = h;
  currentRoute = h; let html = "", tab = r, title = "Training Log";
  if (r !== "edit") cur.draft = null;
  switch (r) {
    case "today": cur.date = todayIso(); html = viewDay(cur.date); break;
    case "day": cur.date = isValidDate(a) ? a : todayIso(); html = viewDay(cur.date); tab = cur.date === todayIso() ? "today" : "plan"; break;
    case "food": if (isValidDate(a)) cur.date = a; else cur.date = todayIso(); html = viewFood(cur.date); title = "Meal plan"; break;
    case "plan": html = viewPlan(); title = "Plan"; break;
    case "insights": html = viewInsights(); title = "Insights"; break;
    case "checkin": html = viewCheckin(a, b); title = "Check-in"; tab = "plan"; break;
    case "more": html = viewMore(); title = "More"; break;
    case "history": html = viewHistory(); title = "History"; tab = "more"; break;
    case "catalog": html = viewCatalog(); title = "Exercises"; tab = "more"; break;
    case "ex": html = viewExercise(decodeURIComponent(a || "")); title = "Exercise"; tab = "more"; break;
    case "blocks": html = viewBlocks(); title = "Blocks"; tab = "more"; break;
    case "edit": html = viewEdit(a); title = "Edit block"; tab = "more"; break;
    default: html = viewDay(todayIso()); tab = "today";
  }
  $("#view").innerHTML = html; $("#title").textContent = title;
  $$("#nav a").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
  if (openD) $$("#view details").forEach((d, i) => { if (openD[i]) d.open = true; });
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { if (TARGET === "pwa") render(false); });

/* ---------- boot ---------- */
(async function boot() {
  try {
    try { idb = await openDB(); await loadAll(); } catch (err) { idb = null; MEMORY_ONLY = true; }
    if (!meta("seeded") && SEED) { await save("blocks", normaliseBlock(clone(SEED))); await setMeta("seeded", true); }
    if (!meta("mig-cat-links") && SEED) {
      const L = {}; for (const d of SEED.days) for (const e of d.exercises) if (e.cat) L[e.name] = e.cat;
      for (const b of [...S.blocks.values()]) { let ch = false; for (const d of b.days) for (const e of d.exercises) if (!e.cat && L[e.name]) { e.cat = L[e.name]; ch = true; } if (ch) await save("blocks", b); }
      await setMeta("mig-cat-links", true);
    }
    if (!meta("mig-thu-checkin")) {
      for (const b of [...S.blocks.values()]) {
        const sun = b.days.find(d => d.dow === 7), thu = b.days.find(d => d.dow === 4);
        if (sun && (sun.notes || []).some(n => /check-in this evening/i.test(n))) { sun.notes = sun.notes.filter(n => !/check-in this evening/i.test(n)); if (thu) { thu.notes = [...(thu.notes || []), CK_NOTE]; thu.checklist = [...(thu.checklist || []), "Check-in done"]; } }
        b.checkinDow = b.checkinDow || 4; await save("blocks", b);
      }
      await setMeta("mig-thu-checkin", true);
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
    render();
    loadCat().catch(() => { });
  } catch (err) { $("#view").innerHTML = `<div class="card"><h3>Storage unavailable</h3><p class="muted">${esc(err.message || err)}</p></div>`; }
  if (TARGET === "pwa" && !NATIVE && "serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => { });
  if (TARGET === "artifact") { $("#hdr-sub").innerHTML = '<span class="chip warn">Preview</span>'; if (window.claude && claude.use) claude.use("downloads").then(d => { DL = d; }).catch(() => { }); }
})();
